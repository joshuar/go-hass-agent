services:
  devcontainer:
    hostname: devcontainer
    env_file:
      - .env
    devices:
      - /dev/dri
    environment:
      - GOHASSAGENT_NOLOGFILE=1
      - PULSE_SERVER=unix:/run/user/1000/pulse/native
    build:
      context: .
      dockerfile: Dockerfile
      args:
        EXTRA_PKGS: ""
    volumes:
      - ..:/workspace
      - /run/dbus:/run/dbus:ro
      - /run/user/$USER_ID/pipewire-0:/tmp/$USER_UID-runtime-dir/pipewire-0:Z
      - /run/user/$USER_ID/pulse/native:/tmp/$USER_UID-runtime-dir/pulse/native:Z
      - go-hass-agent-datahome:/datahome
      - go-hass-agent-node_modules:/workspace/node_modules
      - go-hass-agent-go-mod-cache:/go/pkg/mod
      - go-hass-agent-go-build-cache:/home/vscode/.cache/go-build
      - go-hass-agent-golangci-lint-cache:/home/vscode/.cache/golangci-lint
      - go-hass-agent-npm-build-cache:/home/vscode/.cache/npm
      - go-hass-agent-npm-global:/home/vscode/.npm-global
      - go-hass-agent-gcloud:/home/vscode/.config/gcloud
      - go-hass-agent-tmp-build:/workspace/tmp
    user: vscode
    cap_add:
      - SYS_PTRACE
      - SETUID
      - SETGID
      - SYS_RAWIO
      - SYS_ADMIN
      - MKNOD
      - DAC_OVERRIDE
    security_opt:
      - seccomp:unconfined
      - label:disable
    ports:
      - $GOHASSAGENT_server_port:8223
    command: dbus-launch sleep infinity

  home-assistant:
    hostname: home-assistant
    privileged: true
    cap_add:
      - NET_ADMIN
      - NET_RAW
    env_file:
      - .env
    image: ghcr.io/home-assistant/home-assistant:$HA_VERSION
    volumes:
      - ./data/home-assistant/config:/config
      - /run/dbus:/run/dbus:ro
    ports:
      - 8123:8123

  mosquitto:
    hostname: mosquitto
    env_file:
      - .env
    image: docker.io/eclipse-mosquitto:$MOSQUITTO_VERSION
    volumes:
      - ./data/mosquitto:/mosquitto/config
      - mosquitto-data:/mosquitto/data
    ports:
      - 1883:1883
      - 8883:8883

volumes:
  go-hass-agent-datahome:
  go-hass-agent-node_modules:
  go-hass-agent-go-mod-cache:
  go-hass-agent-go-build-cache:
  go-hass-agent-golangci-lint-cache:
  go-hass-agent-npm-build-cache:
  go-hass-agent-npm-global:
  go-hass-agent-tmp-build:
  mosquitto-data:
